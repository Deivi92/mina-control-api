# ========================================
# CONFIGURACIÓN PARA ENTORNO DE PRODUCCIÓN (prod)
# Todas las variables sensibles se leen desde variables de entorno del sistema.
# ========================================

# --- Base de Datos: PostgreSQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- JPA/Hibernate ---
# 'validate' verifica el esquema sin modificarlo. Usar Flyway/Liquibase para migraciones.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

# --- H2 Console (Deshabilitada en producción) ---
spring.h2.console.enabled=false

# --- Swagger/OpenAPI (Deshabilitada en producción) ---
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# --- Logging ---
logging.level.root=WARN
logging.level.com.minacontrol=INFO

# --- JWT ---
app.jwtSecret=${APP_JWTSECRET}
app.jwtAccessTokenExpirationMs=${APP_JWTACCESSTOKENEXPIRATIONMS:900000}
app.jwtRefreshTokenExpirationMs=${APP_JWTREFRESHTOKENEXPIRATIONMS:604800000}
